name: Build Thunderbird Community Portable (official PAF, independent fallback, ZIP)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable Thunderbird version; latest recommended (never beta/nightly)'
        required: true
        type: string
        default: latest
      allow_independent_nsis_fallback:
        description: 'If official PAF stalls, make a separately LABELED independent NSIS PAF-style installer (not official or certified)'
        required: true
        type: boolean
        default: true
      public_redistribution_ack:
        description: 'PUBLIC repositories only: I confirm I reviewed Thunderbird trademark/redistribution terms and accept responsibility'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: thunderbird-community-portable-release
  cancel-in-progress: false

jobs:
  package:
    name: Verify, package, validate, and release
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - name: Check out standalone builder repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use reproducible Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Public distribution safety gate
        shell: pwsh
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          PUBLIC_ACK: ${{ inputs.public_redistribution_ack }}
        run: |
          if ($env:PRIVATE_REPOSITORY -ne 'true' -and $env:PUBLIC_ACK -ne 'true') {
            throw 'Public builds require checking public_redistribution_ack after reviewing Thunderbird trademark rights. Use a Private repository for personal builds.'
          }

      - name: Check builder structure before downloading
        shell: pwsh
        run: python scripts/test_static.py

      - name: Resolve stable Thunderbird and official release checksum
        id: source
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python scripts/resolve.py --version "$env:REQUESTED_VERSION"

      - name: Verify exact shared publisher action contract
        shell: pwsh
        run: python scripts/verify_publisher.py

      - name: Skip complete immutable existing release
        id: existing
        shell: pwsh
        run: python scripts/check_existing.py --mode full

      - name: Download official Thunderbird installer with Mozilla SHA-256 verification
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: python scripts/download.py

      - name: Verify and extract Mozilla installer without GUI (bounded)
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: python scripts/extract_thunderbird.py

      - name: Obtain official Thunderbird Windows icon and generate PortableApps menu artwork
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install image processing library for official Thunderbird icon.' }
          python scripts/prepare_icons.py
          if ($LASTEXITCODE -ne 0) { throw 'Verified Thunderbird icon acquisition/conversion failed. Refusing generic branding.' }

      - name: Compile the genuine C++ launcher on Windows
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/build_launcher.ps1

      - name: Confirm compiled launcher embeds the actual Thunderbird icon
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: python scripts/prepare_icons.py --verify-launcher

      - name: Package official Thunderbird binaries and portable launcher
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: python scripts/package.py

      - name: Run native launcher diagnostics and real Thunderbird headless smoke test
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Validate ZIP, PE metadata and portable data safety
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          python scripts/validate.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable ZIP verification failed. Publishing is blocked.' }

      - name: Generate official-tool PAF, diagnose bounded failures, and optionally build independent NSIS
        id: paf
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        env:
          ALLOW_INDEPENDENT_NSIS: ${{ inputs.allow_independent_nsis_fallback }}
        run: |
          # An error in the optional official PAF build must never prevent the verified ZIP release.
          # Keep the engine provenance explicit: official, independent, or ziponly.
          $engine = 'ziponly'
          $PSNativeCommandUseErrorActionPreference = $false
          python scripts/build_paf.py
          $officialExit = $LASTEXITCODE
          if ($officialExit -eq 0) {
            python scripts/validate.py --paf
            if ($LASTEXITCODE -eq 0) { $engine = 'official' }
            else { Write-Warning 'The official PAF payload did not match the staged application.' }
          } else {
            Write-Warning "Official vendor compiler unavailable/blocked (exit $officialExit)."
          }
          if ($engine -ne 'official') {
            $targets = Get-Content 'work/targets.json' -Raw | ConvertFrom-Json
            $officialPath = Join-Path 'dist' $targets.paf
            if (Test-Path -LiteralPath $officialPath) { Remove-Item -LiteralPath $officialPath -Force }
            if ($env:ALLOW_INDEPENDENT_NSIS -eq 'true') {
              Write-Host 'Attempting explicitly requested INDEPENDENT NSIS fallback, never labeled official.'
              python scripts/build_independent_nsis.py
              if ($LASTEXITCODE -eq 0) {
                python scripts/validate.py --paf --independent
                if ($LASTEXITCODE -eq 0) { $engine = 'independent' }
              }
              if ($engine -ne 'independent') {
                Write-Warning 'Independent installer missing or invalid. ZIP-only fallback will publish.'
                $independentPath = Join-Path 'dist' $targets.paf_independent
                if (Test-Path -LiteralPath $independentPath) { Remove-Item -LiteralPath $independentPath -Force }
              }
            }
          }
          Write-Host "Final packaging engine: $engine"
          "engine=$engine" >> $env:GITHUB_OUTPUT
          if ($engine -eq 'official') {
            'PASS: Official PortableApps.com Installer produced a statically verified PAF. Interactive install remains untested.' >> $env:GITHUB_STEP_SUMMARY
          } elseif ($engine -eq 'independent') {
            'FALLBACK: Independent NSIS PAF-style installer (NOT official PortableApps.com Installer), plus verified ZIP. Manual PAF install/upgrade not tested.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'FALLBACK: Only the verified EXE-based PortableApps ZIP will publish. No PAF was verified.' >> $env:GITHUB_STEP_SUMMARY
          }
          exit 0

      - name: Choose release files and immutable tag for actual installer engine
        id: selection
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        env:
          ENGINE: ${{ steps.paf.outputs.engine }}
          BASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          if ($env:ENGINE -eq 'official') {
            $mode = 'full'; $tag = $env:BASE_TAG; $files = 'dist/*.zip;dist/*.paf.exe'
          } elseif ($env:ENGINE -eq 'independent') {
            $mode = 'independent'; $tag = "$($env:BASE_TAG)-independent-nsis"; $files = 'dist/*.zip;dist/*_IndependentNSIS.paf.exe'
          } else {
            $mode = 'ziponly'; $tag = "$($env:BASE_TAG)-ziponly"; $files = 'dist/*.zip'
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "files=$files" >> $env:GITHUB_OUTPUT
          Write-Host "Selected release mode=$mode tag=$tag files=$files"

      - name: Protect existing release tag for chosen fallback
        id: fallback_existing
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_MODE: ${{ steps.selection.outputs.mode }}
        run: |
          python scripts/check_existing.py --mode "$env:RELEASE_MODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0

      - name: Dry-run Universal Portable Release Publisher v1.1.1
        if: steps.existing.outputs.skip != 'true' && steps.fallback_existing.outputs.skip != 'true'
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: ${{ steps.selection.outputs.files }}
          tag: ${{ steps.selection.outputs.tag }}
          release-title: Thunderbird Community Portable ${{ steps.selection.outputs.tag }}
          tag-prefix: portable-
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'

      - name: Publish once through the shared publisher v1.1.1
        if: steps.existing.outputs.skip != 'true' && steps.fallback_existing.outputs.skip != 'true'
        uses: vhick/portable-release-publisher@v1.1.1
        with:
          files: ${{ steps.selection.outputs.files }}
          tag: ${{ steps.selection.outputs.tag }}
          release-title: Thunderbird Community Portable ${{ steps.selection.outputs.tag }}
          tag-prefix: portable-
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'

      - name: Confirm actual GitHub Release assets
        if: steps.existing.outputs.skip != 'true' && steps.fallback_existing.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_MODE: ${{ steps.selection.outputs.mode }}
        run: |
          python scripts/confirm_release.py --mode "$env:RELEASE_MODE"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Releases did not contain expected final packages.' }

      - name: Record validation boundaries
        if: always()
        shell: pwsh
        run: |
          'This workflow does not execute the PAF installation UI and does not certify PortableApps.com menu discovery or upgrade behavior. Those require a separate manual Windows acceptance test.' >> $env:GITHUB_STEP_SUMMARY
